name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Configure frontend API address
        env:
          GAME_API_BASE_URL: ${{ vars.GAME_API_BASE_URL }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';

          const rawUrl = process.env.GAME_API_BASE_URL?.trim();
          const apiUrl = rawUrl ? new URL(rawUrl) : null;
          if (apiUrl && (apiUrl.protocol !== 'https:' || apiUrl.username || apiUrl.password || apiUrl.search || apiUrl.hash)) {
            throw new Error('GAME_API_BASE_URL must be an HTTPS API base URL without credentials, query, or fragment');
          }
          if (apiUrl && !apiUrl.pathname.endsWith('/')) apiUrl.pathname += '/';
          const base = apiUrl ? apiUrl.href.replace(/&/g, '&amp;').replace(/"/g, '&quot;') : '';
          const page = 'public/index.html';
          const html = readFileSync(page, 'utf8');
          writeFileSync(page, html.replace('<meta name="game-api-base" content="/api/">', () => `<meta name="game-api-base" content="${base}">`));
          JS
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq 'any(.artifacts[]; .name == "github-pages" and (.expired | not))')" = true ]; then
              exit 0
            fi
            sleep 3
          done
          echo 'The github-pages artifact did not appear in this workflow run.' >&2
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
